name: Daily Telegram message

on:
  schedule:
    # Four runs per UTC day. Each cron owns one segment of the day; the run
    # whose segment contains the date-hashed slot (see SEGMENTS in
    # send_message.py) sends, the others exit in seconds. The segments
    # partition the day, so exactly one run sends even if GitHub delays jobs
    # or starts them all at once. Delays only make the message arrive later,
    # which acts as natural jitter on the send time.
    # Minute 0 is avoided because GitHub often delays or drops those jobs.
    # Keep every cron string identical to SEGMENTS in send_message.py.
    #
    # Together the segments cover 06:30–19:30 UTC (10:00–23:00 at UTC+3:30).
    - cron: "30 6 * * *"   # owns 06:30–10:00 UTC (10:00–13:30 at UTC+3:30)
    - cron: "5 10 * * *"   # owns 10:00–13:30 UTC (13:30–17:00 at UTC+3:30)
    - cron: "30 13 * * *"  # owns 13:30–17:00 UTC (17:00–20:30 at UTC+3:30)
    - cron: "5 17 * * *"   # owns 17:00–19:45 UTC (20:30–23:15 at UTC+3:30)
  workflow_dispatch: {} # send once, immediately, from the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SLOT: ${{ github.event.schedule }}
      FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide if this run sends
        id: decide
        run: python3 send_message.py --decide >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.decide.outputs.send == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.decide.outputs.send == 'true'
        run: pip install -r requirements.txt

      - name: Send message
        if: steps.decide.outputs.send == 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_RECIPIENT: ${{ secrets.TG_RECIPIENT }}
        run: python send_message.py
