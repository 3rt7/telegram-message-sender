name: Daily Telegram message

on:
  schedule:
    # Four runs per UTC day. A hash of the UTC date picks one of these crons
    # (see SLOTS in send_message.py); that run sends, the others exit in
    # seconds. Delays only make the message arrive later, which acts as
    # natural jitter on the send time.
    # Minute 0 is avoided because GitHub often delays or drops those jobs.
    # Keep every cron string identical to SLOTS in send_message.py.
    - cron: "30 6 * * *"   # 06:30 UTC (10:00 at UTC+3:30)
    - cron: "5 10 * * *"   # 10:05 UTC (13:35 at UTC+3:30)
    - cron: "30 13 * * *"  # 13:30 UTC (17:00 at UTC+3:30)
    - cron: "5 17 * * *"   # 17:05 UTC (20:35 at UTC+3:30)
  workflow_dispatch: {} # send once, immediately, from the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SLOT: ${{ github.event.schedule }}
      FORCE_SEND: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide if this run sends
        id: decide
        run: python3 send_message.py --decide >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.decide.outputs.send == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.decide.outputs.send == 'true'
        run: pip install -r requirements.txt

      - name: Send message
        if: steps.decide.outputs.send == 'true'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          TG_RECIPIENT: ${{ secrets.TG_RECIPIENT }}
        run: python send_message.py
